<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google-site-verification"
        content="sIZHHtWDR_Jpu2R8BlClLjxlVsFkZDH-78XM9JMX0Ec">

  <title>三川當舖｜萬華合法當舖｜流程透明・快速審核</title>

  <meta name="description"
        content="三川當舖位於台北市萬華區和平西路三段，政府合法立案，提供汽車、機車、黃金及3C等當舖服務。流程透明，符合條件者可當日完成審核與撥款，歡迎電話或官方 LINE 諮詢。">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
        href="https://sanchuan-pawnshop-production.up.railway.app/">

  <meta property="og:title"
        content="三川當舖｜萬華好鄰居">

  <meta property="og:description"
        content="位於台北市萬華區和平西路三段的三川當舖，提供合法、透明的當舖服務。">

  <meta property="og:type" content="website">

  <meta property="og:url"
        content="https://sanchuan-pawnshop-production.up.railway.app/">

  <style>

    :root {
      --wine: #8F2F24;
      --wine-dark: #6F2119;
      --gold: #C49A5A;
      --gold-light: #E4CFA8;

      --cream: #F7F3ED;
      --cream-dark: #EEE7DD;

      --black: #171717;
      --text: #292929;
      --muted: #77716A;

      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--cream);
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      background: var(--black);
      color: #ddd;
      text-align: center;
      padding: 7px 15px;
      font-size: 13px;
      letter-spacing: 1px;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid var(--gold-light);
      position: relative;
      z-index: 10;
    }

    .header-inner {
      max-width: 1180px;
      min-height: 92px;
      margin: auto;
      padding: 14px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .brand-title {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--black);
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--wine);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .header-phone {
      display: flex;
      align-items: center;

      color: var(--wine);
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .header-phone::before {
      content: "";
      width: 1px;
      height: 30px;
      background: var(--gold-light);
      margin-right: 18px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 85% 25%,
          rgba(196,154,90,0.13),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #F7F3ED 0%,
          #FFFDF9 55%,
          #F1E9DE 100%
        );

      padding: 105px 20px 115px;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 480px;
      height: 480px;

      border: 1px solid rgba(196,154,90,0.18);

      border-radius: 50%;

      right: -180px;
      top: -150px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border: 1px solid rgba(143,47,36,0.08);

      border-radius: 50%;

      right: -100px;
      bottom: -130px;
    }

    .hero-inner {
      position: relative;
      z-index: 2;

      max-width: 1180px;
      margin: auto;

      display: grid;

      grid-template-columns:
        1.2fr
        0.8fr;

      align-items: center;

      gap: 80px;
    }

    .hero h1 {
      font-size: clamp(48px, 6vw, 76px);

      line-height: 1.12;

      letter-spacing: 3px;

      font-weight: 900;

      margin-bottom: 28px;
    }

    .hero h1 span {
      display: inline-block;

      color: var(--wine);

      font-size: 0.55em;

      letter-spacing: 5px;

      margin-top: 14px;
    }

    .hero p {
      max-width: 650px;

      font-size: 19px;

      color: var(--muted);

      margin-bottom: 32px;
    }


    /* =========================
       TAGS
    ========================= */

    .tags {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 34px;
    }

    .tag {
      background: rgba(255,255,255,0.8);

      border: 1px solid var(--gold-light);

      border-radius: 50px;

      padding: 8px 17px;

      color: #594D43;

      font-size: 14px;

      font-weight: bold;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;

      gap: 13px;

      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;

      padding: 14px 27px;

      border-radius: 5px;

      font-weight: bold;

      font-size: 16px;

      text-align: center;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-main {
      background: var(--wine);

      color: white;

      box-shadow:
        0 8px 25px
        rgba(143,47,36,0.22);
    }

    .btn-main:hover {
      background: var(--wine-dark);
    }

    .btn-line {
      background: var(--black);

      color: white;
    }

    .btn-line:hover {
      background: #333;
    }


    /* =========================
       HERO CARD
    ========================= */

    .hero-card {
      position: relative;

      background: rgba(255,255,255,0.88);

      border: 1px solid rgba(196,154,90,0.3);

      border-radius: 18px;

      padding: 42px 38px;

      box-shadow:
        0 25px 60px
        rgba(42,31,22,0.10);

      backdrop-filter: blur(8px);
    }

    .hero-card::before {
      content: "";

      position: absolute;

      top: 0;

      left: 30px;
      right: 30px;

      height: 3px;

      background: var(--gold);
    }

    .hero-card h2 {
      font-size: 25px;

      margin-bottom: 22px;

      letter-spacing: 1px;
    }

    .hero-card li {
      list-style: none;

      padding: 13px 0;

      border-bottom:
        1px solid #EDE6DD;

      color: #4E4944;
    }

    .hero-card li:last-child {
      border-bottom: none;
    }


    /* =========================
       SECTION
    ========================= */

    section {
      padding: 95px 20px;
    }

    .container {
      max-width: 1180px;

      margin: auto;
    }

    .section-title {
      text-align: center;

      margin-bottom: 55px;
    }

    .section-title::before {
      content: "";

      display: block;

      width: 45px;

      height: 2px;

      background: var(--gold);

      margin:
        0 auto 18px;
    }

    .section-title h2 {
      font-size: 38px;

      line-height: 1.3;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }

    .section-title p {
      color: var(--muted);

      font-size: 16px;
    }


    /* =========================
       SERVICES
    ========================= */

    .services {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 20px;
    }

    .service {
      position: relative;

      background: white;

      padding: 38px 24px;

      text-align: center;

      border-radius: 12px;

      border:
        1px solid #E9E1D8;

      box-shadow:
        0 12px 35px
        rgba(45,35,27,0.05);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .service:hover {
      transform: translateY(-7px);

      box-shadow:
        0 20px 45px
        rgba(45,35,27,0.10);
    }

    .service::after {
      content: "";

      position: absolute;

      left: 25%;
      right: 25%;

      bottom: 0;

      height: 2px;

      background: var(--gold);

      opacity: 0;

      transition:
        opacity 0.2s ease;
    }

    .service:hover::after {
      opacity: 1;
    }

    .service .icon {
      font-size: 40px;

      margin-bottom: 18px;
    }

    .service h3 {
      margin-bottom: 10px;

      font-size: 21px;

      letter-spacing: 1px;
    }

    .service p {
      color: var(--muted);

      font-size: 15px;
    }


    /* =========================
       WHY / LOCAL SEO
    ========================= */

    .why {
      background: var(--cream);
    }

    .why-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;
    }

    .why-card {
      position: relative;

      padding: 35px;

      border-radius: 12px;

      background: white;

      border:
        1px solid #E8DFD5;

      box-shadow:
        0 10px 30px
        rgba(45,35,27,0.04);
    }

    .why-card::before {
      content: "";

      display: block;

      width: 30px;

      height: 2px;

      background: var(--gold);

      margin-bottom: 18px;
    }

    .why-card h3 {
      margin-bottom: 12px;

      font-size: 21px;

      letter-spacing: 0.5px;
    }

    .why-card p {
      color: var(--muted);

      font-size: 15px;
    }


    /* =========================
       CONTACT
    ========================= */

    .contact {
      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(196,154,90,0.12),
          transparent 28%
        ),
            linear-gradient(
      135deg,
      #171717 0%,
      #241C19 100%
    );

  color: white;

  padding: 100px 20px;
}

.contact .container {
  max-width: 900px;
}

.contact h2 {
  font-size: 42px;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.contact > .container > p {
  color: #D8D0C8;
  margin-bottom: 35px;
}

.contact-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;

  background: rgba(255,255,255,0.05);

  border: 1px solid rgba(228,207,168,0.25);

  padding: 32px;

  border-radius: 12px;

  margin-bottom: 35px;
}

.contact-item {
  padding: 8px 15px;
  border-right: 1px solid rgba(228,207,168,0.2);
}

.contact-item:last-child {
  border-right: none;
}

.contact-item strong {
  display: block;

  color: var(--gold-light);

  font-size: 14px;

  margin-bottom: 5px;

  letter-spacing: 1px;
}

.contact-item span {
  font-size: 17px;
}

.contact .buttons {
  justify-content: center;
}

.contact .btn-main {
  background: var(--gold);
  color: var(--black);
}

.contact .btn-main:hover {
  background: var(--gold-light);
}

.contact .btn-line {
  background: transparent;

  border: 1px solid rgba(255,255,255,0.35);
}

.contact .btn-line:hover {
  background: rgba(255,255,255,0.08);
}


/* =========================
   FOOTER
========================= */

footer {
  background: #111;

  color: #AAA;

  text-align: center;

  padding: 28px 20px;

  font-size: 13px;

  letter-spacing: 0.5px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

  .hero-inner {
    grid-template-columns: 1fr;

    gap: 45px;
  }

  .hero-card {
    max-width: 650px;

    margin: auto;
  }

  .services {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .why-grid {
    grid-template-columns:
      1fr;
  }

  .contact-info {
    grid-template-columns:
      1fr;
  }

  .contact-item {
    border-right: none;

    border-bottom:
      1px solid rgba(228,207,168,0.2);

    padding:
      15px 0;
  }

  .contact-item:last-child {
    border-bottom: none;
  }
}


@media (max-width: 600px) {

  .topbar {
    font-size: 12px;

    padding: 6px 10px;
  }

  .header-inner {
    min-height: 76px;

    padding: 10px 16px;

    gap: 12px;
  }

  .brand {
    gap: 10px;
  }

  .brand img {
    width: 52px;
    height: 52px;
  }

  .brand-title {
    font-size: 21px;

    letter-spacing: 1px;
  }

  .brand-subtitle {
    font-size: 12px;

    letter-spacing: 1px;

    margin-top: 3px;
  }

  .header-phone {
    font-size: 14px;
  }

  .header-phone::before {
    display: none;
  }

  .hero {
    padding:
      65px 18px 70px;
  }

  .hero h1 {
    font-size:
      clamp(40px, 12vw, 58px);

    letter-spacing: 1px;
  }

  .hero h1 span {
    font-size: 0.48em;

    letter-spacing: 2px;
  }

  .hero p {
    font-size: 16px;
  }

  .hero-card {
    padding: 32px 25px;
  }

  section {
    padding:
      70px 18px;
  }

  .section-title {
    margin-bottom: 38px;
  }

  .section-title h2 {
    font-size: 30px;
  }

  .services {
    grid-template-columns:
      1fr;
  }

  .why-card {
    padding: 28px;
  }

  .contact h2 {
    font-size: 32px;
  }

  .contact-info {
    padding: 28px;
  }

  .buttons {
    flex-direction: column;
  }

  .btn {
    width: 100%;
  }
}

  </style>
</head>
